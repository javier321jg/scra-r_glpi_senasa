version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./basededatos:/app/basededatos
      - ./logs:/app/logs
      - ./static:/app/static
      - ./auth_config.json:/app/auth_config.json
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-senasa_default_secret_key}
      - TZ=America/Lima
    shm_size: '2gb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No exponer puertos directamente - Nginx los gestionará
    expose:
      - "5000"
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./gif:/app/gif
      - ./nginx-logs:/var/log/nginx
    ports:
      - "80:80"
      # Descomentar para HTTPS
      # - "443:443"
    depends_on:
      - app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge