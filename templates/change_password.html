<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENASA - Cambiar Contraseña</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
        }
        
        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
        }
        
        .logo-shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                transparent 0%,
                rgba(255, 255, 255, 0.1) 45%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0.1) 55%,
                transparent 100%
            );
            background-size: 200% 200%;
            animation: shine 3s infinite;
            pointer-events: none;
        }
        
        @keyframes shine {
            0% { background-position: -200% -200%; }
            100% { background-position: 200% 200%; }
        }
        
        .header-container {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        
        .form-card {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.1), 0 8px 10px -6px rgba(30, 58, 138, 0.1);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(to right, #1e3a8a, #1e40af);
            padding: 1.5rem;
            color: white;
        }
        
        .form-input {
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        .submit-btn {
            background: linear-gradient(to right, #1e3a8a, #3b82f6);
            color: white;
            border: none;
            border-radius: 0.375rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
        
        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid #dc2626;
        }
        
        .success-message {
            background-color: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid #059669;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="header-container text-white p-6 shadow-lg">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="logo-container relative w-16 h-16">
                    <img src="https://www.gob.pe/rails/active_storage/representations/redirect/eyJfcmFpbHMiOnsiZGF0YSI6MTQ1MDAsInB1ciI6ImJsb2JfaWQifX0=--d56e8d89845af7a460ccbe0d65ed319826301586/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJwbmciLCJyZXNpemVfdG9fbGltaXQiOltudWxsLDQ4XX0sInB1ciI6InZhcmlhdGlvbiJ9fQ==--830247c4bafe7cadca50817d8559bf1a09e3aa28/Sin%20ti%CC%81tulo-1-01%20(1).png" 
                         alt="SENASA Logo" 
                         class="logo-glow w-full h-full object-contain bg-white p-1 rounded-full">
                    <div class="logo-shine"></div>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">Sistema de Tickets</h1>
                    <p class="text-blue-100 text-sm">Sistema Nacional de Sanidad Agraria</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="{{ url_for('index') }}" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md shadow-md flex items-center transition duration-300 ease-in-out">
                    <i class="fas fa-home mr-2"></i> Inicio
                </a>
                <a href="{{ url_for('logout') }}" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-md shadow-md flex items-center transition duration-300 ease-in-out">
                    <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto mt-8 px-4 mb-12">
        <div class="max-w-2xl mx-auto form-card">
            <div class="form-header flex items-center">
                <i class="fas fa-key text-2xl text-blue-200 mr-3"></i>
                <h2 class="text-xl font-semibold">Cambiar Contraseña</h2>
            </div>
            
            <div class="p-6">
                {% if error %}
                <div class="error-message">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    {{ error }}
                </div>
                {% endif %}
                
                {% if success %}
                <div class="success-message">
                    <i class="fas fa-check-circle mr-2"></i>
                    {{ success }}
                </div>
                {% endif %}
                
                <form method="POST" action="{{ url_for('change_password') }}" id="passwordForm">
                    <div class="mb-4">
                        <label for="current_password" class="block text-gray-700 font-medium mb-2">Contraseña Actual</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="current_password" name="current_password" 
                                   class="form-input pl-10" 
                                   placeholder="Ingrese su contraseña actual" 
                                   required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="new_password" class="block text-gray-700 font-medium mb-2">Nueva Contraseña</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <i class="fas fa-key text-gray-400"></i>
                            </div>
                            <input type="password" id="new_password" name="new_password" 
                                   class="form-input pl-10" 
                                   placeholder="Ingrese su nueva contraseña" 
                                   required>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">La contraseña debe tener al menos 8 caracteres</p>
                    </div>
                    
                    <div class="mb-6">
                        <label for="confirm_password" class="block text-gray-700 font-medium mb-2">Confirmar Nueva Contraseña</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <i class="fas fa-key text-gray-400"></i>
                            </div>
                            <input type="password" id="confirm_password" name="confirm_password" 
                                   class="form-input pl-10" 
                                   placeholder="Confirme su nueva contraseña" 
                                   required>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <a href="{{ url_for('index') }}" class="text-blue-600 hover:text-blue-800 transition duration-300">
                            <i class="fas fa-arrow-left mr-1"></i> Volver
                        </a>
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-save mr-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('passwordForm');
            const newPassword = document.getElementById('new_password');
            const confirmPassword = document.getElementById('confirm_password');
            
            form.addEventListener('submit', function(event) {
                // Validar que las contraseñas coincidan
                if (newPassword.value !== confirmPassword.value) {
                    event.preventDefault();
                    alert('Las contraseñas no coinciden');
                    confirmPassword.focus();
                    return false;
                }
                
                // Validar longitud mínima
                if (newPassword.value.length < 8) {
                    event.preventDefault();
                    alert('La contraseña debe tener al menos 8 caracteres');
                    newPassword.focus();
                    return false;
                }
                
                return true;
            });
        });
    </script>
</body>
</html>
